name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build-test.log; exit ${PIPESTATUS[0]}

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build-apk.log; exit ${PIPESTATUS[0]}

      # Convierte los errores de Gradle/Kotlin en anotaciones, visibles sin abrir el log completo.
      - name: Resumen de errores
        if: failure()
        run: |
          cat build-*.log 2>/dev/null \
            | grep -E '^e: |What went wrong|^> |FAILED|error:|Exception' \
            | grep -v '^> Task' | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVideoDownloader-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
